<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Virtual - Projeto Integrado II</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h1>Assistente Virtual de IA</h1>
            <p>Projeto Integrado II - ADS</p>
        </header>

        <div class="chat-box" id="chatBox">
            <div class="mensagem ia">
                <strong>Assistente:</strong> Olá! Como posso te ajudar com problemas de TI ou suporte de computadores hoje?
            </div>
        </div>

        <form class="chat-input-area" id="chatForm">
            <input type="text" id="userInput" placeholder="Digite sua mensagem aqui..." required autocomplete="off">
            <button type="submit" id="sendBtn">Enviar</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
