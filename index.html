<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronical AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header class="top-bar">
            <h2>Chronical AI</h2>
        </header>

        <main id="messages" class="chat-box">
            <div class="message ai">Olá! Sou a Chronical. Como posso ajudar?</div>
        </main>

        <footer class="input-container">
            <input type="text" id="chat-input" placeholder="Escreva a sua mensagem..." autocomplete="off" />
            <button id="send-btn" type="button">Enviar</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
