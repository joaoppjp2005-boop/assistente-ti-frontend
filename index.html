<!-- MODAL DE CONFIGURAÇÕES -->
    <div id="settings-modal" class="settings-modal hidden">
        <div class="settings-modal-overlay" id="close-settings-overlay"></div>
        <div class="settings-box">
            <div class="settings-header">
                <h2>Configurações</h2>
                <button id="close-settings-btn" class="close-modal-x">&times;</button>
            </div>
            
            <div class="settings-body">
                <!-- Navegação apenas com a aba Geral -->
                <nav class="settings-tabs">
                    <button class="tab-btn active" data-tab="tab-general">Geral</button>
                </nav>

                <!-- Conteúdo da Aba Geral -->
                <div class="tab-content active" id="tab-general">
                    <div class="setting-item">
                        <div class="setting-info">
                            <span class="setting-title">Leitura automática</span>
                            <span class="setting-desc">Lê automaticamente as respostas da IA</span>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="auto-read-toggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
