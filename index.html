<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronical - Assistente Virtual</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="auth-container" class="auth-container">
        <div class="auth-box">
            <h2>Chronical AI</h2>
            <p>Acesse com sua conta ou continue como visitante</p>

            <button id="google-login-btn" class="google-btn" type="button">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                <span>Entrar com o Google</span>
            </button>

            <div class="divider">ou</div>

            <input type="email" id="auth-email" placeholder="Seu e-mail" autocomplete="email" />
            <input type="password" id="auth-password" placeholder="Sua senha" autocomplete="current-password" />

            <div class="auth-buttons">
                <button id="login-btn" type="button">Entrar</button>
                <button id="register-btn" class="secondary-btn" type="button">Cadastrar</button>
            </div>

            <button id="guest-btn" class="guest-btn" type="button" onclick="entrarComoVisitanteDirecto()">Continuar como Visitante</button>
            <p id="auth-error" class="error-msg"></p>
        </div>
    </div>

    <!-- TELA DO CHAT -->
    <div id="chat-container" class="chat-container hidden" role="main">
        <!-- Botão Flutuante de 3 Barrinhas -->
        <button id="menu-btn" class="floating-menu-btn" aria-label="Abrir menu" type="button">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <!-- Sidebar / Histórico de Conversas -->
        <aside id="sidebar-menu" class="sidebar-menu">
            <div class="sidebar-header">
                <h3>Menu</h3>
                <button id="close-menu-btn" class="close-menu-btn" type="button">&times;</button>
            </div>

            <div class="sidebar-content">
                <button id="new-chat-btn" class="new-chat-btn" type="button">+ Novo Chat</button>

                <div class="history-section">
                    <span class="section-label">Histórico de Conversas</span>
                    <div id="history-list" class="history-list">
                        <!-- Itens do histórico inseridos via JS -->
                    </div>
                </div>

                <div class="user-info-card">
                    <span class="user-label">Usuário</span>
                    <span id="user-display-name">Visitante</span>
                </div>

                <div class="menu-item">
                    <span>Enviar Áudio como:</span>
                    <select id="audio-mode-select" class="select-input">
                        <option value="text">Texto (Transcrição)</option>
                        <option value="voice">Áudio Gravado</option>
                    </select>
                </div>

                <div class="menu-item">
                    <span>Leitura por Voz</span>
                    <button id="voice-toggle-btn" type="button">🔈 OFF</button>
                </div>

                <div class="logout-section">
                    <button id="logout-btn" type="button">Sair da Conta</button>
                </div>
            </div>
        </aside>

        <main id="chat-box" class="chat-box">
            <div class="message assistant-message">
                <div class="message-header">Chronical</div>
                <div class="markdown-content">Olá! Sou a Chronical. Como posso ajudar você hoje?</div>
            </div>
        </main>

        <footer class="input-container">
            <div id="attachment-preview" class="attachment-preview hidden">
                <span id="attachment-name"></span>
                <button id="remove-attachment-btn" type="button">&times;</button>
            </div>

            <!-- Estilo de Barra Estilo Gemini -->
            <div class="gemini-input-wrapper">
                <label for="file-input" class="gemini-action-btn" title="Adicionar arquivo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </label>
                <input type="file" id="file-input" class="hidden" accept="image/*,.pdf,.doc,.docx,.txt" />

                <!-- Campo de Texto -->
                <input type="text" id="user-input" placeholder="Pergunte algo..." autocomplete="off" />

                <!-- Visualizador/Indicador de Áudio (Onda Sonora) -->
                <div id="audio-wave-container" class="audio-wave-container hidden">
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                </div>

                <!-- Botão Parar / Limpar Gravação -->
                <button id="stop-audio-btn" type="button" class="gemini-action-btn hidden" title="Cancelar gravação">
                    <div class="stop-icon"></div>
                </button>

                <!-- Botão do Microfone -->
                <button id="mic-btn" type="button" class="gemini-action-btn" title="Falar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C10.34 2 9 3.34 9 5V11C9 12.66 10.34 14 12 14C13.66 14 15 12.66 15 11V5C15 3.34 13.66 2 12 2ZM19 11C19 14.53 16.39 17.44 13 17.93V20H17V22H7V20H11V17.93C7.61 17.44 5 14.53 5 11H7C7 13.76 9.24 16 12 16C14.76 16 17 13.76 17 11H19Z"/>
                    </svg>
                </button>
                
                <!-- Botão de Enviar Azul -->
                <button id="send-btn" class="gemini-send-btn" aria-label="Enviar" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <script>
        function entrarComoVisitanteDirecto() {
            document.getElementById("auth-container").style.display = "none";
            document.getElementById("chat-container").classList.remove("hidden");
            document.getElementById("chat-container").style.display = "flex";
            document.getElementById("user-display-name").textContent = "Visitante";
        }

        const BACKEND_URL = "/api/chat";

        document.addEventListener("DOMContentLoaded", () => {
            const chatBox = document.getElementById("chat-box");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            const fileInput = document.getElementById("file-input");
            const attachmentPreview = document.getElementById("attachment-preview");
            const attachmentName = document.getElementById("attachment-name");
            const removeAttachmentBtn = document.getElementById("remove-attachment-btn");
            const micBtn = document.getElementById("mic-btn");
            const stopAudioBtn = document.getElementById("stop-audio-btn");
            const audioWaveContainer = document.getElementById("audio-wave-container");
            const historyList = document.getElementById("history-list");
            const newChatBtn = document.getElementById("new-chat-btn");

            let currentFile = null;
            let currentChatId = Date.now().toString();
            let chatsHistory = JSON.parse(localStorage.getItem("chronical_chats")) || {};

            /* Gerenciar Histórico de Conversas */
            function saveCurrentChat(firstUserMsg) {
                if (!chatsHistory[currentChatId]) {
                    chatsHistory[currentChatId] = {
                        title: firstUserMsg.length > 25 ? firstUserMsg.substring(0, 25) + "..." : firstUserMsg,
                        messages: []
                    };
                }
                localStorage.setItem("chronical_chats", JSON.stringify(chatsHistory));
                renderHistoryList();
            }

            function renderHistoryList() {
                historyList.innerHTML = "";
                const keys = Object.keys(chatsHistory).reverse();
                
                if (keys.length === 0) {
                    historyList.innerHTML = `<span class="empty-history">Nenhuma conversa salva</span>`;
                    return;
                }

                keys.forEach(id => {
                    const item = document.createElement("div");
                    item.classList.add("history-item");
                    if (id === currentChatId) item.classList.add("active");
                    item.textContent = chatsHistory[id].title || "Conversa";

                    item.addEventListener("click", () => {
                        currentChatId = id;
                        loadChat(id);
                        toggleSidebar(false);
                    });

                    historyList.appendChild(item);
                });
            }

            function loadChat(id) {
                chatBox.innerHTML = "";
                const chat = chatsHistory[id];
                if (chat && chat.messages) {
                    chat.messages.forEach(m => {
                        appendMessageUI(m.sender, m.text, m.type, m.fileName);
                    });
                } else {
                    appendMessageUI("Chronical", "Olá! Sou a Chronical. Como posso ajudar você hoje?", "ia");
                }
                renderHistoryList();
            }

            newChatBtn.addEventListener("click", () => {
                currentChatId = Date.now().toString();
                chatBox.innerHTML = "";
                appendMessageUI("Chronical", "Olá! Sou a Chronical. Como posso ajudar você hoje?", "ia");
                renderHistoryList();
                toggleSidebar(false);
            });

            /* Anexos */
            fileInput.addEventListener("change", (e) => {
                const file = e.target.files[0];
                if (file) {
                    currentFile = file;
                    attachmentName.textContent = `📄 ${file.name}`;
                    attachmentPreview.classList.remove("hidden");
                }
            });

            removeAttachmentBtn.addEventListener("click", () => {
                currentFile = null;
                fileInput.value = "";
                attachmentPreview.classList.add("hidden");
            });

            /* Microfone e Interface de Áudio (Gemini Style) */
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            let recognition = null;
            let isListeningSpeech = false;

            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'pt-BR';
                recognition.continuous = true;
                recognition.interimResults = true;

                recognition.onstart = () => {
                    isListeningSpeech = true;
                    userInput.classList.add("hidden");
                    micBtn.classList.add("hidden");
                    audioWaveContainer.classList.remove("hidden");
                    stopAudioBtn.classList.remove("hidden");
                };

                recognition.onresult = (event) => {
                    let transcript = "";
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        transcript += event.results[i][0].transcript;
                    }
                    userInput.value = transcript;
                };

                recognition.onerror = recognition.onend = () => {
                    resetAudioUI();
                };
            }

            function resetAudioUI() {
                isListeningSpeech = false;
                userInput.classList.remove("hidden");
                micBtn.classList.remove("hidden");
                audioWaveContainer.classList.add("hidden");
                stopAudioBtn.classList.add("hidden");
            }

            micBtn.addEventListener("click", () => {
                if (SpeechRecognition) {
                    if (!isListeningSpeech) recognition.start();
                } else {
                    alert("Reconhecimento de voz não suportado neste navegador.");
                }
            });

            stopAudioBtn.addEventListener("click", () => {
                if (recognition && isListeningSpeech) {
                    recognition.stop();
                }
                resetAudioUI();
            });

            /* Menu Lateral */
            const menuBtn = document.getElementById("menu-btn");
            const closeMenuBtn = document.getElementById("close-menu-btn");
            const sidebarMenu = document.getElementById("sidebar-menu");
            const sidebarOverlay = document.getElementById("sidebar-overlay");

            function toggleSidebar(open) {
                if (open) {
                    sidebarMenu.classList.add("open");
                    sidebarOverlay.classList.add("visible");
                } else {
                    sidebarMenu.classList.remove("open");
                    sidebarOverlay.classList.remove("visible");
                }
            }

            if (menuBtn) menuBtn.addEventListener("click", () => toggleSidebar(true));
            if (closeMenuBtn) closeMenuBtn.addEventListener("click", () => toggleSidebar(false));
            if (sidebarOverlay) sidebarOverlay.addEventListener("click", () => toggleSidebar(false));

            function appendMessageUI(sender, text, type, fileName = null) {
                const msgDiv = document.createElement("div");
                msgDiv.classList.add("message", type === "user" ? "user-message" : "assistant-message");
                
                let fileTag = fileName ? `<div class="file-tag">📄 ${fileName}</div>` : '';
                let header = `<div class="message-header">${sender}</div>`;

                if (type === "ia" && typeof marked !== "undefined") {
                    msgDiv.innerHTML = `${header}${fileTag}<div class="markdown-content">${marked.parse(text)}</div>`;
                } else {
                    msgDiv.innerHTML = `${header}${fileTag}${text}`;
                }
                chatBox.appendChild(msgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
                return msgDiv;
            }

            async function sendMessage() {
                if (recognition && isListeningSpeech) recognition.stop();
                resetAudioUI();

                const messageText = userInput.value.trim();
                if (!messageText && !currentFile) return;

                const fileAttachedName = currentFile ? currentFile.name : null;

                appendMessageUI("Você", messageText || "(Arquivo enviado)", "user", fileAttachedName);
                saveCurrentChat(messageText || "Arquivo enviado");

                userInput.value = "";
                currentFile = null;
                fileInput.value = "";
                attachmentPreview.classList.add("hidden");

                const aiMsgDiv = document.createElement("div");
                aiMsgDiv.classList.add("message", "assistant-message");
                aiMsgDiv.innerHTML = `
                    <div class="message-header">Chronical</div>
                    <div class="markdown-content">
                        <div class="typing-dots"><span></span><span></span><span></span></div>
                    </div>`;
                chatBox.appendChild(aiMsgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;

                const contentSpan = aiMsgDiv.querySelector(".markdown-content");

                try {
                    const response = await fetch(BACKEND_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: messageText })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        contentSpan.innerHTML = `<span style="color:#f85149;">${data.error || "Ocorreu um erro no servidor."}</span>`;
                        return;
                    }

                    if (data.text) {
                        contentSpan.innerHTML = typeof marked !== "undefined" ? marked.parse(data.text) : data.text;
                        
                        if (!chatsHistory[currentChatId]) chatsHistory[currentChatId] = { title: messageText.substring(0,25), messages: [] };
                        chatsHistory[currentChatId].messages.push({ sender: "Você", text: messageText, type: "user" });
                        chatsHistory[currentChatId].messages.push({ sender: "Chronical", text: data.text, type: "ia" });
                        localStorage.setItem("chronical_chats", JSON.stringify(chatsHistory));

                    } else {
                        contentSpan.innerHTML = "Resposta vazia da IA.";
                    }
                    chatBox.scrollTop = chatBox.scrollHeight;

                } catch (error) {
                    contentSpan.innerHTML = `<span style="color:#f85149;">Erro de conexão ao servidor.</span>`;
                }
            }

            if (sendBtn) sendBtn.addEventListener("click", sendMessage);
            if (userInput) {
                userInput.addEventListener("keypress", (e) => {
                    if (e.key === "Enter") sendMessage();
                });
            }

            renderHistoryList();
        });
    </script>
</body>
</html>
