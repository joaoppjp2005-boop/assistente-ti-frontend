<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronical - Assistente Virtual</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Biblioteca para formatar texto Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- SDKs do Firebase Auth (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

    <!-- TELA DE LOGIN E CADASTRO -->
    <div id="auth-container" class="auth-container">
        <div class="auth-box">
            <h2>Chronical AI</h2>
            <p>Aceda com a sua conta ou continue como visitante</p>

            <button id="google-login-btn" class="google-btn" type="button">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Entrar com o Google
            </button>

            <div class="divider">ou</div>

            <input type="email" id="auth-email" placeholder="Seu e-mail" autocomplete="email" />
            <input type="password" id="auth-password" placeholder="Sua senha" autocomplete="current-password" />

            <div class="auth-buttons">
                <button id="login-btn" type="button">Entrar</button>
                <button id="register-btn" class="secondary-btn" type="button">Cadastrar</button>
            </div>

            <button id="guest-btn" class="guest-btn" type="button" onclick="entrarComoVisitanteDirecto()">Continuar como Visitante</button>
            
            <p id="auth-error" class="error-msg"></p>
        </div>
    </div>

    <!-- TELA DO CHAT -->
    <div id="chat-container" class="chat-container hidden" role="main">
        <header>
            <h1>Chronical</h1>
            <button id="menu-btn" class="menu-toggle-btn" aria-label="Abrir menu" type="button">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </header>

        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <aside id="sidebar-menu" class="sidebar-menu">
            <div class="sidebar-header">
                <h3>Opções</h3>
                <button id="close-menu-btn" class="close-menu-btn" type="button">&times;</button>
            </div>
            <div class="sidebar-content">
                <div class="user-info-card">
                    <span class="user-label">Utilizador</span>
                    <span id="user-display-name">Visitante</span>
                </div>

                <div class="menu-item">
                    <span>Leitura por Voz</span>
                    <button id="voice-toggle-btn" type="button">🔈 OFF</button>
                </div>

                <div class="logout-section">
                    <button id="logout-btn" aria-label="Sair da conta" type="button">Sair da Conta</button>
                </div>
            </div>
        </aside>

        <main id="chat-box" class="chat-box" role="log" aria-live="polite">
            <div class="message assistant-message">
                <div class="message-header">Chronical</div>
                <div class="markdown-content">Olá! Sou a Chronical. Como posso ajudar você hoje?</div>
            </div>
        </main>

        <footer class="input-container">
            <div id="attachment-preview" class="attachment-preview hidden">
                <span id="attachment-name"></span>
                <button id="remove-attachment-btn" type="button">&times;</button>
            </div>

            <div class="input-wrapper">
                <label for="file-input" class="attach-btn" title="Anexar ficheiro">📎</label>
                <input type="file" id="file-input" class="hidden" accept="image/*,.pdf,.doc,.docx,.txt" />

                <input type="text" id="user-input" placeholder="Pergunte algo à Chronical..." autocomplete="off" />

                <button id="mic-btn" type="button" class="icon-btn" title="Falar por voz">🎤</button>
                
                <button id="send-btn" class="send-btn-icon" aria-label="Enviar mensagem" type="button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </footer>
    </div>

    <script>
        function entrarComoVisitanteDirecto() {
            document.getElementById("auth-container").style.display = "none";
            document.getElementById("chat-container").classList.remove("hidden");
            document.getElementById("chat-container").style.display = "flex";
            document.getElementById("user-display-name").textContent = "Visitante";
        }

        const firebaseConfig = {
            apiKey: "AIzaSyCAbWdM9bvpVH8od0Ls0nipAcjMmrKDP8M",
            authDomain: "chronical-624a2.firebaseapp.com",
            projectId: "chronical-624a2",
            storageBucket: "chronical-624a2.firebasestorage.app",
            messagingSenderId: "919413941674",
            appId: "1:919413941674:web:a2e56297e56f666b44f7d3",
            measurementId: "G-KP1PZPM94N"
        };

        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
            try { firebase.initializeApp(firebaseConfig); } catch(e){}
        }

        const BACKEND_URL = "/api/chat";

        document.addEventListener("DOMContentLoaded", () => {
            const authEmail = document.getElementById("auth-email");
            const authPassword = document.getElementById("auth-password");
            const authError = document.getElementById("auth-error");
            const loginBtn = document.getElementById("login-btn");
            const registerBtn = document.getElementById("register-btn");
            const googleLoginBtn = document.getElementById("google-login-btn");
            const logoutBtn = document.getElementById("logout-btn");
            const chatBox = document.getElementById("chat-box");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            const voiceToggleBtn = document.getElementById("voice-toggle-btn");

            const fileInput = document.getElementById("file-input");
            const attachmentPreview = document.getElementById("attachment-preview");
            const attachmentName = document.getElementById("attachment-name");
            const removeAttachmentBtn = document.getElementById("remove-attachment-btn");
            const micBtn = document.getElementById("mic-btn");

            let currentFile = null;

            fileInput.addEventListener("change", (e) => {
                const file = e.target.files[0];
                if (file) {
                    currentFile = file;
                    attachmentName.textContent = `📎 ${file.name}`;
                    attachmentPreview.classList.remove("hidden");
                }
            });

            removeAttachmentBtn.addEventListener("click", () => {
                currentFile = null;
                fileInput.value = "";
                attachmentPreview.classList.add("hidden");
            });

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            let recognition = null;
            let isListening = false;

            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'pt-BR';
                recognition.continuous = false;

                recognition.onstart = () => {
                    isListening = true;
                    micBtn.classList.add("recording");
                    userInput.placeholder = "A ouvir...";
                };

                recognition.onresult = (event) => {
                    userInput.value = event.results[0][0].transcript;
                };

                recognition.onerror = recognition.onend = () => {
                    isListening = false;
                    micBtn.classList.remove("recording");
                    userInput.placeholder = "Pergunte algo à Chronical...";
                };

                micBtn.addEventListener("click", () => {
                    if (isListening) recognition.stop();
                    else recognition.start();
                });
            } else {
                micBtn.style.display = "none";
            }

            const menuBtn = document.getElementById("menu-btn");
            const closeMenuBtn = document.getElementById("close-menu-btn");
            const sidebarMenu = document.getElementById("sidebar-menu");
            const sidebarOverlay = document.getElementById("sidebar-overlay");

            function toggleSidebar(open) {
                if (open) {
                    sidebarMenu.classList.add("open");
                    sidebarOverlay.classList.add("visible");
                } else {
                    sidebarMenu.classList.remove("open");
                    sidebarOverlay.classList.remove("visible");
                }
            }

            if (menuBtn) menuBtn.addEventListener("click", () => toggleSidebar(true));
            if (closeMenuBtn) closeMenuBtn.addEventListener("click", () => toggleSidebar(false));
            if (sidebarOverlay) sidebarOverlay.addEventListener("click", () => toggleSidebar(false));

            let isVoiceEnabled = false;

            if (voiceToggleBtn) {
                voiceToggleBtn.addEventListener("click", () => {
                    isVoiceEnabled = !isVoiceEnabled;
                    voiceToggleBtn.textContent = isVoiceEnabled ? "🔊 ON" : "🔈 OFF";
                    voiceToggleBtn.style.backgroundColor = isVoiceEnabled ? "#238636" : "#21262d";
                    
                    if (!isVoiceEnabled && 'speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                    }
                });
            }

            function speakText(text) {
                if (!isVoiceEnabled || !('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/[*#_`~]/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'pt-BR';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }

            if (typeof firebase !== 'undefined' && firebase.auth) {
                firebase.auth().onAuthStateChanged((user) => {
                    if (user) {
                        document.getElementById("auth-container").style.display = "none";
                        document.getElementById("chat-container").classList.remove("hidden");
                        document.getElementById("chat-container").style.display = "flex";
                        document.getElementById("user-display-name").textContent = user.displayName || user.email;
                    }
                });
            }

            if (loginBtn) {
                loginBtn.addEventListener("click", () => {
                    const email = authEmail.value.trim();
                    const password = authPassword.value.trim();
                    if (!email || !password) return authError.textContent = "Preencha e-mail e senha.";
                    firebase.auth().signInWithEmailAndPassword(email, password)
                        .catch(err => authError.textContent = "Erro: " + err.message);
                });
            }

            if (registerBtn) {
                registerBtn.addEventListener("click", () => {
                    const email = authEmail.value.trim();
                    const password = authPassword.value.trim();
                    if (!email || !password) return authError.textContent = "Preencha e-mail e senha.";
                    firebase.auth().createUserWithEmailAndPassword(email, password)
                        .then(() => alert("Conta criada!"))
                        .catch(err => authError.textContent = "Erro: " + err.message);
                });
            }

            if (googleLoginBtn) {
                googleLoginBtn.addEventListener("click", () => {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    firebase.auth().signInWithPopup(provider)
                        .catch(err => authError.textContent = "Erro Google: " + err.message);
                });
            }

            if (logoutBtn) {
                logoutBtn.addEventListener("click", () => {
                    if (typeof firebase !== 'undefined' && firebase.auth) firebase.auth().signOut();
                    window.location.reload();
                });
            }

            function appendMessage(sender, text, type, fileName = null) {
                const msgDiv = document.createElement("div");
                msgDiv.classList.add("message", type === "user" ? "user-message" : "assistant-message");
                
                let fileTag = fileName ? `<div class="file-tag">📄 ${fileName}</div>` : '';
                let header = `<div class="message-header">${sender}</div>`;

                if (type === "ia" && typeof marked !== "undefined") {
                    msgDiv.innerHTML = `${header}${fileTag}<div class="markdown-content">${marked.parse(text)}</div>`;
                } else {
                    msgDiv.innerHTML = `${header}${fileTag}${text}`;
                }
                chatBox.appendChild(msgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
                return msgDiv;
            }

            async function sendMessage() {
                const messageText = userInput.value.trim();
                if (!messageText && !currentFile) return;

                const fileAttachedName = currentFile ? currentFile.name : null;

                appendMessage("Você", messageText || "(Arquivo enviado)", "user", fileAttachedName);
                userInput.value = "";
                
                currentFile = null;
                fileInput.value = "";
                attachmentPreview.classList.add("hidden");

                // Indicador de carregamento suave
                const aiMsgDiv = document.createElement("div");
                aiMsgDiv.classList.add("message", "assistant-message");
                aiMsgDiv.innerHTML = `
                    <div class="message-header">Chronical</div>
                    <div class="markdown-content">
                        <div class="typing-dots"><span></span><span></span><span></span></div>
                    </div>`;
                chatBox.appendChild(aiMsgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;

                const contentSpan = aiMsgDiv.querySelector(".markdown-content");

                try {
                    const response = await fetch(BACKEND_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: messageText })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        contentSpan.innerHTML = `<span style="color:#f85149;">${data.error || "Ocorreu um erro no servidor."}</span>`;
                        return;
                    }

                    if (data.text) {
                        contentSpan.innerHTML = typeof marked !== "undefined" ? marked.parse(data.text) : data.text;
                        speakText(data.text);
                    } else {
                        contentSpan.innerHTML = "Resposta vazia da IA.";
                    }
                    chatBox.scrollTop = chatBox.scrollHeight;

                } catch (error) {
                    contentSpan.innerHTML = `<span style="color:#f85149;">Erro de conexão ao servidor.</span>`;
                }
            }

            if (sendBtn) sendBtn.addEventListener("click", sendMessage);
            if (userInput) {
                userInput.addEventListener("keypress", (e) => {
                    if (e.key === "Enter") sendMessage();
                });
            }
        });
    </script>
</body>
</html>
