<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronical AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-container {
      background-color: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-container h2 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #38bdf8;
    }

    .login-container p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 1.5rem;
    }

    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #ffffff;
      color: #333333;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-google:hover {
      background-color: #f1f5f9;
    }

    .divider {
      margin: 1.5rem 0;
      color: #64748b;
      font-size: 0.85rem;
    }

    .input-group {
      margin-bottom: 1rem;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }

    .input-group input:focus {
      border-color: #38bdf8;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 1rem;
    }

    .btn-primary, .btn-secondary {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-primary {
      background-color: #0284c7;
      color: #ffffff;
    }

    .btn-secondary {
      background-color: #334155;
      color: #ffffff;
    }

    .btn-primary:hover, .btn-secondary:hover {
      opacity: 0.9;
    }

    .error-message {
      margin-top: 1rem;
      color: #ef4444;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Chronical AI</h2>
    <p>Acesse sua conta para salvar seu histórico e perfil</p>

    <button type="button" id="btn-google" class="btn-google">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo" width="18">
      <span>Entrar com o Google</span>
    </button>

    <div class="divider">ou</div>

    <form id="form-login">
      <div class="input-group">
        <input type="text" placeholder="Seu nome (para cadastro)" id="input-nome">
      </div>
      <div class="input-group">
        <input type="email" placeholder="Seu e-mail" id="input-email" required>
      </div>
      <div class="input-group">
        <input type="password" placeholder="Sua senha" id="input-senha" required>
      </div>

      <div class="button-group">
        <button type="submit" id="btn-entrar" class="btn-primary">Entrar</button>
        <button type="button" id="btn-cadastrar" class="btn-secondary">Cadastrar</button>
      </div>
    </form>

    <div id="mensagem-erro" class="error-message"></div>
  </div>

  <script type="module" src="script.js"></script>

</body>
</html>
