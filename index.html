<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronical - Assistente Virtual</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="auth-container" class="auth-container">
        <div class="auth-box">
            <h2>Chronical AI</h2>
            <p>Acesse com sua conta ou continue como visitante</p>

            <button id="google-login-btn" class="google-btn" type="button">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                <span>Entrar com o Google</span>
            </button>

            <div class="divider">ou</div>

            <input type="email" id="auth-email" placeholder="Seu e-mail" autocomplete="email" />
            <input type="password" id="auth-password" placeholder="Sua senha" autocomplete="current-password" />

            <div class="auth-buttons">
                <button id="login-btn" class="btn-green" type="button">Entrar</button>
                <button id="register-btn" class="secondary-btn" type="button">Cadastrar</button>
            </div>

            <button id="guest-btn" class="guest-btn" type="button" onclick="entrarComoVisitanteDirecto()">Continuar como Visitante</button>
            <p id="auth-error" class="error-msg"></p>
        </div>
    </div>

    <!-- TELA DO CHAT -->
    <div id="chat-container" class="chat-container hidden" role="main">
        
        <!-- Botão Flutuante de 3 Barrinhas (Sem Barra de Cabeçalho) -->
        <button id="menu-btn" class="floating-menu-btn" aria-label="Abrir menu" type="button">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <!-- Sidebar / Menu Lateral -->
        <aside id="sidebar-menu" class="sidebar-menu">
            <div class="sidebar-header">
                <h3>Menu</h3>
                <button id="close-menu-btn" class="close-menu-btn" type="button">&times;</button>
            </div>

            <div class="sidebar-content">
                <button id="new-chat-btn" class="new-chat-btn" type="button">+ Novo Chat</button>

                <div class="history-section">
                    <span class="section-label">Histórico</span>
                    <div id="history-list" class="history-list"></div>
                </div>

                <div class="user-info-card">
                    <span class="user-label">Usuário</span>
                    <span id="user-display-name">Visitante</span>
                </div>

                <div class="logout-section">
                    <button id="logout-btn" type="button">Sair da Conta</button>
                </div>
            </div>
        </aside>

        <!-- Área das Mensagens -->
        <main id="chat-box" class="chat-box">
            <div class="message assistant-message">
                <div class="message-header">CHRONICAL</div>
                <div class="markdown-content">Olá! Sou a Chronical. Como posso ajudar você hoje?</div>
            </div>
        </main>

        <!-- Barra de Entrada de Texto / Áudio -->
        <footer class="input-container">
            <div id="attachment-preview" class="attachment-preview hidden">
                <span id="attachment-name"></span>
                <button id="remove-attachment-btn" type="button">&times;</button>
            </div>

            <div class="input-wrapper">
                <!-- Ícone + de Anexo -->
                <label for="file-input" class="action-btn" title="Adicionar arquivo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </label>
                <input type="file" id="file-input" class="hidden" accept="image/*,.pdf,.doc,.docx,.txt" />

                <!-- Campo de Texto Padrão -->
                <input type="text" id="user-input" placeholder="Pergunte algo à Chronical..." autocomplete="off" />

                <!-- Visualizador de Áudio (Onda Sonora ao Gravar) -->
                <div id="audio-wave-container" class="audio-wave-container hidden">
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                </div>

                <!-- Botão de Parar Gravação (Quadrado) -->
                <button id="stop-audio-btn" type="button" class="stop-audio-btn hidden" title="Cancelar gravação">
                    <div class="stop-square"></div>
                </button>

                <!-- Botão do Microfone -->
                <button id="mic-btn" type="button" class="action-btn" title="Falar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C10.34 2 9 3.34 9 5V11C9 12.66 10.34 14 12 14C13.66 14 15 12.66 15 11V5C15 3.34 13.66 2 12 2ZM19 11C19 14.53 16.39 17.44 13 17.93V20H17V22H7V20H11V17.93C7.61 17.44 5 14.53 5 11H7C7 13.76 9.24 16 12 16C14.76 16 17 13.76 17 11H19Z"/>
                    </svg>
                </button>
                
                <!-- Botão Enviar Padrão (Verde) -->
                <button id="send-btn" class="send-btn-green" aria-label="Enviar" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>

                <!-- Botão Enviar Áudio (Azul com seta para cima) -->
                <button id="send-audio-btn" class="send-btn-blue hidden" aria-label="Enviar Áudio" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <script>
        function entrarComoVisitanteDirecto() {
            document.getElementById("auth-container").style.display = "none";
            document.getElementById("chat-container").classList.remove("hidden");
            document.getElementById("chat-container").style.display = "flex";
            document.getElementById("user-display-name").textContent = "Visitante";
        }

        const BACKEND_URL = "/api/chat";

        document.addEventListener("DOMContentLoaded", () => {
            const chatBox = document.getElementById("chat-box");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            const sendAudioBtn = document.getElementById("send-audio-btn");
            const fileInput = document.getElementById("file-input");
            const attachmentPreview = document.getElementById("attachment-preview");
            const attachmentName = document.getElementById("attachment-name");
            const removeAttachmentBtn = document.getElementById("remove-attachment-btn");
            const micBtn = document.getElementById("mic-btn");
            const stopAudioBtn = document.getElementById("stop-audio-btn");
            const audioWaveContainer = document.getElementById("audio-wave-container");

            let currentFile = null;

            /* Gerenciamento do Modo de Gravação de Áudio */
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            let recognition = null;
            let isListeningSpeech = false;

            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'pt-BR';
                recognition.continuous = true;
                recognition.interimResults = true;

                recognition.onstart = () => {
                    isListeningSpeech = true;
                    // Alterna para a barra de áudio
                    userInput.classList.add("hidden");
                    micBtn.classList.add("hidden");
                    sendBtn.classList.add("hidden");

                    audioWaveContainer.classList.remove("hidden");
                    stopAudioBtn.classList.remove("hidden");
                    sendAudioBtn.classList.remove("hidden");
                };

                recognition.onresult = (event) => {
                    let transcript = "";
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        transcript += event.results[i][0].transcript;
                    }
                    userInput.value = transcript;
                };

                recognition.onerror = recognition.onend = () => {
                    if (!userInput.value.trim()) {
                        resetAudioUI();
                    }
                };
            }

            function resetAudioUI() {
                isListeningSpeech = false;
                userInput.classList.remove("hidden");
                micBtn.classList.remove("hidden");
                sendBtn.classList.remove("hidden");

                audioWaveContainer.classList.add("hidden");
                stopAudioBtn.classList.add("hidden");
                sendAudioBtn.classList.add("hidden");
            }

            micBtn.addEventListener("click", () => {
                if (SpeechRecognition) {
                    if (!isListeningSpeech) recognition.start();
                } else {
                    alert("Reconhecimento de voz não suportado neste navegador.");
                }
            });

            stopAudioBtn.addEventListener("click", () => {
                if (recognition && isListeningSpeech) recognition.stop();
                userInput.value = "";
                resetAudioUI();
            });

            sendAudioBtn.addEventListener("click", () => {
                if (recognition && isListeningSpeech) recognition.stop();
                sendMessage();
            });

            /* Menu Lateral */
            const menuBtn = document.getElementById("menu-btn");
            const closeMenuBtn = document.getElementById("close-menu-btn");
            const sidebarMenu = document.getElementById("sidebar-menu");
            const sidebarOverlay = document.getElementById("sidebar-overlay");

            function toggleSidebar(open) {
                if (open) {
                    sidebarMenu.classList.add("open");
                    sidebarOverlay.classList.add("visible");
                } else {
                    sidebarMenu.classList.remove("open");
                    sidebarOverlay.classList.remove("visible");
                }
            }

            if (menuBtn) menuBtn.addEventListener("click", () => toggleSidebar(true));
            if (closeMenuBtn) closeMenuBtn.addEventListener("click", () => toggleSidebar(false));
            if (sidebarOverlay) sidebarOverlay.addEventListener("click", () => toggleSidebar(false));

            function appendMessageUI(sender, text, type) {
                const msgDiv = document.createElement("div");
                msgDiv.classList.add("message", type === "user" ? "user-message" : "assistant-message");
                let header = `<div class="message-header">${sender}</div>`;

                if (type === "ia" && typeof marked !== "undefined") {
                    msgDiv.innerHTML = `${header}<div class="markdown-content">${marked.parse(text)}</div>`;
                } else {
                    msgDiv.innerHTML = `${header}${text}`;
                }
                chatBox.appendChild(msgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
                return msgDiv;
            }

            async function sendMessage() {
                const messageText = userInput.value.trim();
                if (!messageText && !currentFile) return;

                appendMessageUI("Você", messageText || "(Arquivo enviado)", "user");

                userInput.value = "";
                resetAudioUI();

                const aiMsgDiv = document.createElement("div");
                aiMsgDiv.classList.add("message", "assistant-message");
                aiMsgDiv.innerHTML = `
                    <div class="message-header">CHRONICAL</div>
                    <div class="markdown-content">
                        <div class="typing-dots"><span></span><span></span><span></span></div>
                    </div>`;
                chatBox.appendChild(aiMsgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;

                const contentSpan = aiMsgDiv.querySelector(".markdown-content");

                try {
                    const response = await fetch(BACKEND_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: messageText })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        contentSpan.innerHTML = `<span style="color:#f85149;">${data.error || "Erro no servidor."}</span>`;
                        return;
                    }

                    contentSpan.innerHTML = typeof marked !== "undefined" ? marked.parse(data.text) : data.text;
                    chatBox.scrollTop = chatBox.scrollHeight;

                } catch (error) {
                    contentSpan.innerHTML = `<span style="color:#f85149;">Erro de conexão ao servidor.</span>`;
                }
            }

            if (sendBtn) sendBtn.addEventListener("click", sendMessage);
            if (userInput) {
                userInput.addEventListener("keypress", (e) => {
                    if (e.key === "Enter") sendMessage();
                });
            }
        });
    </script>
</body>
</html>
