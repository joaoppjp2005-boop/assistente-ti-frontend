<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronical - Assistente Virtual</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Biblioteca para formatar texto Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- SDKs do Firebase Auth (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

    <!-- TELA DE LOGIN E CADASTRO -->
    <div id="auth-container" class="auth-container">
        <div class="auth-box">
            <h2>Bem-vindo à Chronical</h2>
            <p>Acesse com sua conta ou continue como visitante</p>

            <button id="google-login-btn" class="google-btn" type="button">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Entrar com o Google
            </button>

            <div class="divider">ou</div>

            <input type="email" id="auth-email" placeholder="Seu e-mail" autocomplete="email" />
            <input type="password" id="auth-password" placeholder="Sua senha" autocomplete="current-password" />

            <div class="auth-buttons">
                <button id="login-btn" type="button">Entrar</button>
                <button id="register-btn" class="secondary-btn" type="button">Cadastrar</button>
            </div>

            <button id="guest-btn" class="guest-btn" type="button" onclick="entrarComoVisitanteDirecto()">Continuar como Visitante</button>
            
            <p id="auth-error" class="error-msg"></p>
        </div>
    </div>

    <!-- TELA DO CHAT -->
    <div id="chat-container" class="chat-container hidden" role="main">
        <header>
            <h1>Chronical</h1>
            <div class="user-profile" style="display: flex; align-items: center; gap: 8px;">
                <!-- BOTÃO DE VOZ VISÍVEL COM COR DE DESTAQUE -->
                <button id="voice-toggle-btn" type="button" style="padding: 6px 12px; font-size: 14px; cursor: pointer; border-radius: 4px; border: none; background-color: #007bff; color: white;">
                    🔈 Voz: OFF
                </button>
                <span id="user-display-name"></span>
                <button id="logout-btn" aria-label="Sair da conta" type="button">Sair</button>
            </div>
        </header>

        <main id="chat-box" class="chat-box" role="log" aria-live="polite" aria-label="Histórico de mensagens">
            <div class="message assistant-message">
                <strong>Chronical:</strong> Olá! Sou a Chronical. Como posso ajudar você hoje?
            </div>
        </main>

        <footer class="input-container" role="region" aria-label="Área de envio de mensagem">
            <label for="user-input" class="sr-only">Digite sua mensagem para a Chronical</label>
            <input 
                type="text" 
                id="user-input" 
                placeholder="Digite sua mensagem aqui..." 
                aria-label="Mensagem para o assistente"
                autocomplete="off"
            />
            <button id="send-btn" aria-label="Enviar mensagem" type="button">Enviar</button>
        </footer>
    </div>

    <script>
        function entrarComoVisitanteDirecto() {
            document.getElementById("auth-container").style.display = "none";
            document.getElementById("chat-container").classList.remove("hidden");
            document.getElementById("chat-container").style.display = "flex";
            document.getElementById("user-display-name").textContent = "Visitante";
        }

        const firebaseConfig = {
            apiKey: "AIzaSyCAbWdM9bvpVH8od0Ls0nipAcjMmrKDP8M",
            authDomain: "chronical-624a2.firebaseapp.com",
            projectId: "chronical-624a2",
            storageBucket: "chronical-624a2.firebasestorage.app",
            messagingSenderId: "919413941674",
            appId: "1:919413941674:web:a2e56297e56f666b44f7d3",
            measurementId: "G-KP1PZPM94N"
        };

        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
            try { firebase.initializeApp(firebaseConfig); } catch(e){}
        }

        const BACKEND_URL = "/api/chat";

        document.addEventListener("DOMContentLoaded", () => {
            const authEmail = document.getElementById("auth-email");
            const authPassword = document.getElementById("auth-password");
            const authError = document.getElementById("auth-error");
            const loginBtn = document.getElementById("login-btn");
            const registerBtn = document.getElementById("register-btn");
            const googleLoginBtn = document.getElementById("google-login-btn");
            const logoutBtn = document.getElementById("logout-btn");
            const chatBox = document.getElementById("chat-box");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            const voiceToggleBtn = document.getElementById("voice-toggle-btn");

            let isVoiceEnabled = false;

            if (voiceToggleBtn) {
                voiceToggleBtn.addEventListener("click", () => {
                    isVoiceEnabled = !isVoiceEnabled;
                    voiceToggleBtn.textContent = isVoiceEnabled ? "🔊 Voz: ON" : "🔈 Voz: OFF";
                    voiceToggleBtn.style.backgroundColor = isVoiceEnabled ? "#28a745" : "#007bff";
                    
                    if (!isVoiceEnabled && 'speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                    }
                });
            }

            function speakText(text) {
                if (!isVoiceEnabled || !('speechSynthesis' in window)) return;

                window.speechSynthesis.cancel();

                const cleanText = text.replace(/[*#_`~]/g, '');

                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'pt-BR';
                utterance.rate = 1.0;

                window.speechSynthesis.speak(utterance);
            }

            if (typeof firebase !== 'undefined' && firebase.auth) {
                firebase.auth().onAuthStateChanged((user) => {
                    if (user) {
                        document.getElementById("auth-container").style.display = "none";
                        document.getElementById("chat-container").classList.remove("hidden");
                        document.getElementById("chat-container").style.display = "flex";
                        document.getElementById("user-display-name").textContent = user.displayName || user.email;
                    }
                });
            }

            if (loginBtn) {
                loginBtn.addEventListener("click", () => {
                    const email = authEmail.value.trim();
                    const password = authPassword.value.trim();
                    if (!email || !password) return authError.textContent = "Preencha e-mail e senha.";
                    firebase.auth().signInWithEmailAndPassword(email, password)
                        .catch(err => authError.textContent = "Erro: " + err.message);
                });
            }

            if (registerBtn) {
                registerBtn.addEventListener("click", () => {
                    const email = authEmail.value.trim();
                    const password = authPassword.value.trim();
                    if (!email || !password) return authError.textContent = "Preencha e-mail e senha.";
                    firebase.auth().createUserWithEmailAndPassword(email, password)
                        .then(() => alert("Conta criada!"))
                        .catch(err => authError.textContent = "Erro: " + err.message);
                });
            }

            if (googleLoginBtn) {
                googleLoginBtn.addEventListener("click", () => {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    firebase.auth().signInWithPopup(provider)
                        .catch(err => authError.textContent = "Erro Google: " + err.message);
                });
            }

            if (logoutBtn) {
                logoutBtn.addEventListener("click", () => {
                    if (typeof firebase !== 'undefined' && firebase.auth) firebase.auth().signOut();
                    window.location.reload();
                });
            }

            function appendMessage(sender, text, type) {
                const msgDiv = document.createElement("div");
                msgDiv.classList.add("message", type === "user" ? "user-message" : "assistant-message");
                if (type === "ia" && typeof marked !== "undefined") {
                    msgDiv.innerHTML = `<strong>${sender}:</strong> <div class="markdown-content">${marked.parse(text)}</div>`;
                } else {
                    msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
                }
                chatBox.appendChild(msgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
                return msgDiv;
            }

            async function sendMessage() {
                const messageText = userInput.value.trim();
                if (!messageText) return;

                appendMessage("Você", messageText, "user");
                userInput.value = "";

                const aiMsgDiv = document.createElement("div");
                aiMsgDiv.classList.add("message", "assistant-message");
                aiMsgDiv.innerHTML = `<strong>Chronical:</strong> <span class="markdown-content">Pensando...</span>`;
                chatBox.appendChild(aiMsgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;

                const contentSpan = aiMsgDiv.querySelector(".markdown-content");

                try {
                    const response = await fetch(BACKEND_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: messageText })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        contentSpan.innerHTML = data.error || "Erro ao obter resposta do servidor.";
                        return;
                    }

                    if (data.text) {
                        contentSpan.innerHTML = typeof marked !== "undefined" ? marked.parse(data.text) : data.text;
                        speakText(data.text);
                    } else {
                        contentSpan.innerHTML = "Resposta vazia da IA.";
                    }
                    chatBox.scrollTop = chatBox.scrollHeight;

                } catch (error) {
                    contentSpan.innerHTML = "Erro de conexão ao servidor.";
                }
            }

            if (sendBtn) sendBtn.addEventListener("click", sendMessage);
            if (userInput) {
                userInput.addEventListener("keypress", (e) => {
                    if (e.key === "Enter") sendMessage();
                });
            }
        });
    </script>
</body>
</html>
