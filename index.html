<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronical - Assistente Virtual</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="chat-container" role="main">
        <header>
            <h1>Chronical</h1>
        </header>

        <!-- aria-live="polite" faz os leitores de ecrã lerem as novas respostas automaticamente -->
        <main id="chat-box" class="chat-box" role="log" aria-live="polite" aria-label="Histórico de mensagens do chat">
            <div class="message assistant-message">
                <strong>Chronical:</strong> Olá! Sou a Chronical. Como posso ajudar você hoje?
            </div>
        </main>

        <footer class="input-container" role="region" aria-label="Envio de mensagem">
            <label for="user-input" class="sr-only">Digite sua mensagem para a Chronical</label>
            <input 
                type="text" 
                id="user-input" 
                placeholder="Digite sua mensagem aqui..." 
                aria-label="Mensagem para o assistente"
                autocomplete="off"
            />
            <button id="send-btn" aria-label="Enviar mensagem">Enviar</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
