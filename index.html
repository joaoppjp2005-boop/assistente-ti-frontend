<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronical - Assistente Virtual</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="auth-container" class="auth-container">
        <div class="auth-box">
            <h2>Chronical AI</h2>
            <p>Acesse com sua conta ou continue como visitante</p>

            <button id="google-login-btn" class="google-btn" type="button">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Entrar com o Google
            </button>

            <div class="divider">ou</div>

            <input type="email" id="auth-email" placeholder="Seu e-mail" autocomplete="email" />
            <input type="password" id="auth-password" placeholder="Sua senha" autocomplete="current-password" />

            <div class="auth-buttons">
                <button id="login-btn" type="button">Entrar</button>
                <button id="register-btn" class="secondary-btn" type="button">Cadastrar</button>
            </div>

            <button id="guest-btn" class="guest-btn" type="button" onclick="entrarComoVisitanteDirecto()">Continuar como Visitante</button>
            <p id="auth-error" class="error-msg"></p>
        </div>
    </div>

    <!-- TELA DO CHAT -->
    <div id="chat-container" class="chat-container hidden" role="main">
        <header>
            <!-- 3 Barrinhas no Lado Esquerdo -->
            <button id="menu-btn" class="menu-toggle-btn" aria-label="Abrir menu" type="button">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <h1>Chronical</h1>
            <div style="width: 28px;"></div> <!-- Espaçador para centralizar o título -->
        </header>

        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <!-- Sidebar deslizando da esquerda -->
        <aside id="sidebar-menu" class="sidebar-menu">
            <div class="sidebar-header">
                <h3>Opções</h3>
                <button id="close-menu-btn" class="close-menu-btn" type="button">&times;</button>
            </div>
            <div class="sidebar-content">
                <div class="user-info-card">
                    <span class="user-label">Usuário</span>
                    <span id="user-display-name">Visitante</span>
                </div>

                <div class="menu-item">
                    <span>Enviar Áudio como:</span>
                    <select id="audio-mode-select" class="select-input">
                        <option value="text">Texto (Transcrição)</option>
                        <option value="voice">Áudio Gravado</option>
                    </select>
                </div>

                <div class="menu-item">
                    <span>Leitura por Voz</span>
                    <button id="voice-toggle-btn" type="button">🔈 OFF</button>
                </div>

                <div class="logout-section">
                    <button id="logout-btn" type="button">Sair da Conta</button>
                </div>
            </div>
        </aside>

        <main id="chat-box" class="chat-box">
            <div class="message assistant-message">
                <div class="message-header">Chronical</div>
                <div class="markdown-content">Olá! Sou a Chronical. Como posso ajudar você hoje?</div>
            </div>
        </main>

        <footer class="input-container">
            <div id="attachment-preview" class="attachment-preview hidden">
                <span id="attachment-name"></span>
                <button id="remove-attachment-btn" type="button">&times;</button>
            </div>

            <div class="input-wrapper">
                <!-- Ícone de Anexo mudado para um mais (+) -->
                <label for="file-input" class="attach-btn" title="Adicionar arquivo">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </label>
                <input type="file" id="file-input" class="hidden" accept="image/*,.pdf,.doc,.docx,.txt" />

                <input type="text" id="user-input" placeholder="Pergunte algo à Chronical..." autocomplete="off" />

                <!-- Ícone do Microfone Exatamente igual ao modelo da imagem -->
                <button id="mic-btn" type="button" class="icon-btn" title="Falar / Gravar">
                    <svg width="20" height="22" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C10.34 2 9 3.34 9 5V11C9 12.66 10.34 14 12 14C13.66 14 15 12.66 15 11V5C15 3.34 13.66 2 12 2ZM19 11C19 14.53 16.39 17.44 13 17.93V20H17V22H7V20H11V17.93C7.61 17.44 5 14.53 5 11H7C7 13.76 9.24 16 12 16C14.76 16 17 13.76 17 11H19Z"/>
                    </svg>
                </button>
                
                <button id="send-btn" class="send-btn-icon" aria-label="Enviar" type="button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </footer>
    </div>

    <script>
        function entrarComoVisitanteDirecto() {
            document.getElementById("auth-container").style.display = "none";
            document.getElementById("chat-container").classList.remove("hidden");
            document.getElementById("chat-container").style.display = "flex";
            document.getElementById("user-display-name").textContent = "Visitante";
        }

        const BACKEND_URL = "/api/chat";

        document.addEventListener("DOMContentLoaded", () => {
            const chatBox = document.getElementById("chat-box");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            const fileInput = document.getElementById("file-input");
            const attachmentPreview = document.getElementById("attachment-preview");
            const attachmentName = document.getElementById("attachment-name");
            const removeAttachmentBtn = document.getElementById("remove-attachment-btn");
            const micBtn = document.getElementById("mic-btn");
            const audioModeSelect = document.getElementById("audio-mode-select");

            let currentFile = null;
            let mediaRecorder = null;
            let audioChunks = [];
            let isRecordingAudio = false;

            /* Gerenciamento de Anexo */
            fileInput.addEventListener("change", (e) => {
                const file = e.target.files[0];
                if (file) {
                    currentFile = file;
                    attachmentName.textContent = `📄 ${file.name}`;
                    attachmentPreview.classList.remove("hidden");
                }
            });

            removeAttachmentBtn.addEventListener("click", () => {
                currentFile = null;
                fileInput.value = "";
                attachmentPreview.classList.add("hidden");
            });

            /* Lógica de Microfone: Alterna entre Reconhecimento de Texto e Gravação de Áudio */
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            let recognition = null;
            let isListeningSpeech = false;

            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'pt-BR';
                recognition.continuous = false;

                recognition.onstart = () => {
                    isListeningSpeech = true;
                    micBtn.classList.add("recording");
                    userInput.placeholder = "Ouvindo...";
                };

                recognition.onresult = (event) => {
                    userInput.value = event.results[0][0].transcript;
                };

                recognition.onerror = recognition.onend = () => {
                    isListeningSpeech = false;
                    micBtn.classList.remove("recording");
                    userInput.placeholder = "Pergunte algo à Chronical...";
                };
            }

            micBtn.addEventListener("click", async () => {
                const mode = audioModeSelect.value;

                if (mode === "text") {
                    if (SpeechRecognition) {
                        if (isListeningSpeech) recognition.stop();
                        else recognition.start();
                    } else {
                        alert("Reconhecimento de voz em texto não é suportado neste navegador.");
                    }
                } else {
                    // Modo Áudio Gravado
                    if (!isRecordingAudio) {
                        try {
                            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                            mediaRecorder = new MediaRecorder(stream);
                            audioChunks = [];

                            mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
                            mediaRecorder.onstop = () => {
                                const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                                const audioUrl = URL.createObjectURL(audioBlob);
                                appendAudioMessage("Você", audioUrl, "user");
                                stream.getTracks().forEach(track => track.stop());
                            };

                            mediaRecorder.start();
                            isRecordingAudio = true;
                            micBtn.classList.add("recording");
                            userInput.placeholder = "Gravando áudio...";
                        } catch (err) {
                            alert("Permissão de microfone negada ou não suportada.");
                        }
                    } else {
                        mediaRecorder.stop();
                        isRecordingAudio = false;
                        micBtn.classList.remove("recording");
                        userInput.placeholder = "Pergunte algo à Chronical...";
                    }
                }
            });

            /* Menu Lateral à Esquerda */
            const menuBtn = document.getElementById("menu-btn");
            const closeMenuBtn = document.getElementById("close-menu-btn");
            const sidebarMenu = document.getElementById("sidebar-menu");
            const sidebarOverlay = document.getElementById("sidebar-overlay");

            function toggleSidebar(open) {
                if (open) {
                    sidebarMenu.classList.add("open");
                    sidebarOverlay.classList.add("visible");
                } else {
                    sidebarMenu.classList.remove("open");
                    sidebarOverlay.classList.remove("visible");
                }
            }

            if (menuBtn) menuBtn.addEventListener("click", () => toggleSidebar(true));
            if (closeMenuBtn) closeMenuBtn.addEventListener("click", () => toggleSidebar(false));
            if (sidebarOverlay) sidebarOverlay.addEventListener("click", () => toggleSidebar(false));

            function appendAudioMessage(sender, audioUrl, type) {
                const msgDiv = document.createElement("div");
                msgDiv.classList.add("message", type === "user" ? "user-message" : "assistant-message");
                msgDiv.innerHTML = `
                    <div class="message-header">${sender}</div>
                    <audio controls src="${audioUrl}" style="max-width: 100%; margin-top: 4px;"></audio>
                `;
                chatBox.appendChild(msgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            function appendMessage(sender, text, type, fileName = null) {
                const msgDiv = document.createElement("div");
                msgDiv.classList.add("message", type === "user" ? "user-message" : "assistant-message");
                
                let fileTag = fileName ? `<div class="file-tag">📄 ${fileName}</div>` : '';
                let header = `<div class="message-header">${sender}</div>`;

                if (type === "ia" && typeof marked !== "undefined") {
                    msgDiv.innerHTML = `${header}${fileTag}<div class="markdown-content">${marked.parse(text)}</div>`;
                } else {
                    msgDiv.innerHTML = `${header}${fileTag}${text}`;
                }
                chatBox.appendChild(msgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
                return msgDiv;
            }

            async function sendMessage() {
                const messageText = userInput.value.trim();
                if (!messageText && !currentFile) return;

                const fileAttachedName = currentFile ? currentFile.name : null;

                appendMessage("Você", messageText || "(Arquivo enviado)", "user", fileAttachedName);
                userInput.value = "";
                
                currentFile = null;
                fileInput.value = "";
                attachmentPreview.classList.add("hidden");

                const aiMsgDiv = document.createElement("div");
                aiMsgDiv.classList.add("message", "assistant-message");
                aiMsgDiv.innerHTML = `
                    <div class="message-header">Chronical</div>
                    <div class="markdown-content">
                        <div class="typing-dots"><span></span><span></span><span></span></div>
                    </div>`;
                chatBox.appendChild(aiMsgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;

                const contentSpan = aiMsgDiv.querySelector(".markdown-content");

                try {
                    const response = await fetch(BACKEND_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: messageText })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        contentSpan.innerHTML = `<span style="color:#f85149;">${data.error || "Ocorreu um erro no servidor."}</span>`;
                        return;
                    }

                    if (data.text) {
                        contentSpan.innerHTML = typeof marked !== "undefined" ? marked.parse(data.text) : data.text;
                    } else {
                        contentSpan.innerHTML = "Resposta vazia da IA.";
                    }
                    chatBox.scrollTop = chatBox.scrollHeight;

                } catch (error) {
                    contentSpan.innerHTML = `<span style="color:#f85149;">Erro de conexão ao servidor.</span>`;
                }
            }

            if (sendBtn) sendBtn.addEventListener("click", sendMessage);
            if (userInput) {
                userInput.addEventListener("keypress", (e) => {
                    if (e.key === "Enter") sendMessage();
                });
            }
        });
    </script>
</body>
</html>
