<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronical I.A</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Tela de Login / Autenticação */
    #auth-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .login-box {
      background: #161e2e;
      border: 1px solid #22c55e;
      border-radius: 16px;
      padding: 2.5rem;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.2);
    }

    .login-box h2 {
      color: #22c55e;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .login-box p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 1.8rem;
    }

    .btn-google {
      width: 100%;
      padding: 12px;
      background: #ffffff;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
    }

    /* Aplicação Principal (Escondida por defeito até fazer login) */
    .app-main {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    .sidebar {
      width: 260px;
      background: #111827;
      border-right: 1px solid #1f2937;
      display: flex;
      flex-direction: column;
      padding: 1rem;
    }

    .sidebar-header {
      color: #22c55e;
      font-weight: bold;
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0b0f19;
    }

    .messages-container {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
    }

    .input-bar {
      padding: 1rem 2rem;
      background: #111827;
      border-top: 1px solid #1f2937;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-bar input {
      flex: 1;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      outline: none;
    }

    .btn-green {
      background-color: #22c55e;
      color: #000;
      font-weight: 600;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Classe utilitária para esconder elementos */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Tela de Login (Visível inicialmente) -->
  <div id="auth-container">
    <div class="login-box">
      <h2>Chronical I.A</h2>
      <p>Acesse sua conta para continuar</p>
      <button type="button" id="btn-google" class="btn-google">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
        <span>Entrar com o Google</span>
      </button>
    </div>
  </div>

  <!-- Painel do Chat (Oculto até o utilizador se autenticar) -->
  <div id="app-container" class="app-main hidden">
    <aside class="sidebar">
      <div class="sidebar-header">Chronical I.A</div>
      <div style="color: #94a3b8; font-size: 0.85rem;">Histórico de conversas</div>
    </aside>

    <main class="chat-area">
      <div class="messages-container" id="messages">
        <div style="background: #161e2e; padding: 12px; border-radius: 8px; max-width: 70%;">
          Olá! Sou a Chronical. Como posso ajudar você hoje?
        </div>
      </div>

      <div class="input-bar">
        <input type="text" placeholder="Digite sua mensagem..." id="chat-input">
        <button class="btn-green">Enviar</button>
      </div>
    </main>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
